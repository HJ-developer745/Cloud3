<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Create account · CloudDrive</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<main class="auth-wrap">
  <section class="auth-card" aria-labelledby="register-title">
    <div class="auth-brand"><span class="brand-mark">☁️</span><span>CloudDrive</span></div>
    <div class="auth-heading">
      <h1 id="register-title">Create your account</h1>
      <p>Start storing and managing your files.</p>
    </div>
    <form id="registerForm" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" autocomplete="name" placeholder="Your name" required>
      <label for="regEmail">Email</label>
      <input id="regEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="regPassword">Password</label>
      <input id="regPassword" name="password" type="password" minlength="6" autocomplete="new-password" placeholder="At least 6 characters" required>
      <button id="registerBtn" class="btn primary btn-full" type="submit">Create account</button>
      <p id="msg" class="error" role="alert" aria-live="polite"></p>
    </form>
    <p class="auth-footer">Already registered? <a href="/login.html">Sign in</a></p>
  </section>
</main>
<script>
const registerForm = document.getElementById("registerForm");
const registerMsg = document.getElementById("msg");
const registerBtn = document.getElementById("registerBtn");
registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  registerMsg.textContent = "";
  registerBtn.disabled = true;
  registerBtn.textContent = "Creating account…";
  try {
    const r = await fetch("/api/auth/register", {
      method:"POST", headers:{"Content-Type":"application/json"},
      credentials:"include", body:JSON.stringify(Object.fromEntries(new FormData(registerForm)))
    });
    const x = await r.json().catch(() => ({success:false,message:"Invalid server response"}));
    if (x.success) location.href = "/";
    else registerMsg.textContent = x.message || "Registration failed";
  } catch {
    registerMsg.textContent = "Unable to connect. Please try again.";
  } finally {
    registerBtn.disabled = false;
    registerBtn.textContent = "Create account";
  }
});
</script>
</body>
</html>
